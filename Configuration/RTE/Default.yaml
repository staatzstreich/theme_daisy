# RTE preset of the theme: a slim CKEditor 5 configuration matching the
# daisyUI front-end typography. Registered as `daisy_default` in
# ext_localconf.php and activated by `RTE.default.preset` in the site set.
#
# Note: H1 is deliberately not offered - the page templates already provide
# the page-level heading.
imports:
  - { resource: 'EXT:rte_ckeditor/Configuration/RTE/Processing.yaml' }
  - { resource: 'EXT:rte_ckeditor/Configuration/RTE/Editor/Base.yaml' }
  - { resource: 'EXT:rte_ckeditor/Configuration/RTE/Editor/Plugins.yaml' }

editor:
  config:
    contentsCss:
      - "EXT:theme_daisy/Resources/Public/Css/rte.css"

    toolbar:
      items:
        - heading
        - '|'
        - bold
        - italic
        - '|'
        - bulletedList
        - numberedList
        - '|'
        - link
        - insertTable
        - '|'
        - removeFormat
        - undo
        - redo
        - '|'
        - specialCharacters
        - sourceEditing

    heading:
      options:
        - { model: 'paragraph', title: 'Paragraph', class: 'ck-heading_paragraph' }
        - { model: 'heading2', view: 'h2', title: 'Heading 2', class: 'ck-heading_heading2' }
        - { model: 'heading3', view: 'h3', title: 'Heading 3', class: 'ck-heading_heading3' }
        - { model: 'heading4', view: 'h4', title: 'Heading 4', class: 'ck-heading_heading4' }

    insertTable:
      rows: 3
      columns: 3

    table:
      tableToolbar:
        items:
          - tableColumn
          - tableRow
          - mergeTableCells