categories:
  theme:
    label: 'Theme'

# The 35 enum values below are the three-way source of truth and MUST stay in
# sync with:
#   1. Resources/Private/Assets/Css/main.css (@plugin "daisyui" themes block),
#   2. Resources/Private/Components/Actions/ThemeSwitcher.fluid.html (built-in list).
# Visitors may override this default client-side; it only sets the initial
# data-theme value rendered on the <html> element (see setup.typoscript).
settings:
  theme.daisy.defaultTheme:
    label: 'Default daisyUI theme'
    description: 'Initial data-theme value stamped on the <html> element; visitors can override it with the theme switcher.'
    default: light
    type: string
    enum:
      light: 'Light'
      dark: 'Dark'
      cupcake: 'Cupcake'
      bumblebee: 'Bumblebee'
      emerald: 'Emerald'
      corporate: 'Corporate'
      synthwave: 'Synthwave'
      retro: 'Retro'
      cyberpunk: 'Cyberpunk'
      valentine: 'Valentine'
      halloween: 'Halloween'
      garden: 'Garden'
      forest: 'Forest'
      aqua: 'Aqua'
      lofi: 'Lofi'
      pastel: 'Pastel'
      fantasy: 'Fantasy'
      wireframe: 'Wireframe'
      black: 'Black'
      luxury: 'Luxury'
      dracula: 'Dracula'
      cmyk: 'CMYK'
      autumn: 'Autumn'
      business: 'Business'
      acid: 'Acid'
      lemonade: 'Lemonade'
      night: 'Night'
      coffee: 'Coffee'
      winter: 'Winter'
      dim: 'Dim'
      nord: 'Nord'
      sunset: 'Sunset'
      caramellatte: 'Caramel Latte'
      abyss: 'Abyss'
      silk: 'Silk'
    category: theme