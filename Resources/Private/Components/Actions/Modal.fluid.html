<f:argument name="id" type="string" />
<f:argument name="heading" type="string" optional="{true}" default="" />

<dialog id="{id}" class="modal">
    <div class="modal-box">
        <form method="dialog">
            <button class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2">✕</button>
        </form>
        <f:if condition="{heading}">
            <h3 class="text-lg font-bold">{heading}</h3>
        </f:if>
        <f:slot />
    </div>
    <form method="dialog" class="modal-backdrop">
        <button>close</button>
    </form>
</dialog>
