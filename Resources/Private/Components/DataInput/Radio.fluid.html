<f:argument name="name" type="string" />
<f:argument name="value" type="string" optional="{true}" default="" />
<f:argument name="checked" type="boolean" optional="{true}" default="{false}" />
<f:argument name="variant" type="string" optional="{true}" default="" />
<f:argument name="size" type="string" optional="{true}" default="md" />
<f:argument name="disabled" type="boolean" optional="{true}" default="{false}" />

<f:variable name="classes">radio<f:if condition="{variant}"> radio-{variant}</f:if><f:if condition="{size}"> radio-{size}</f:if></f:variable>

<input type="radio" name="{name}"<f:if condition="{value}"> value="{value}"</f:if> class="{classes}"<f:if condition="{checked}"> checked="checked"</f:if><f:if condition="{disabled}"> disabled="disabled"</f:if> />
