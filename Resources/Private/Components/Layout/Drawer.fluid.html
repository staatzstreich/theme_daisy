<f:argument name="id" type="string" />
<f:argument name="end" type="boolean" optional="{true}" default="{false}" />
<f:argument name="sidebar" type="string" optional="{true}" default="" />

<div class="drawer<f:if condition="{end}"> drawer-end</f:if>">
    <input id="{id}" type="checkbox" class="drawer-toggle" />
    <div class="drawer-content">
        <f:slot />
    </div>
    <div class="drawer-side">
        <label for="{id}" aria-label="close sidebar" class="drawer-overlay"></label>
        <ul class="menu bg-base-200 min-h-full w-80 p-4">
            <f:if condition="{sidebar}">
                <f:format.raw>{sidebar}</f:format.raw>
            </f:if>
        </ul>
    </div>
</div>
