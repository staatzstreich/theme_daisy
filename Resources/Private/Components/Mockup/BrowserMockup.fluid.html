<f:argument name="url" type="string" optional="{true}" default="" />

<div class="mockup-browser border border-base-300 bg-base-200">
    <div class="mockup-browser-toolbar">
        <f:if condition="{url}">
            <div class="input">{url}</div>
        </f:if>
    </div>
    <div class="grid place-content-center border-t border-base-300 bg-base-100">
        <f:slot />
    </div>
</div>
