<f:argument name="items" type="array" optional="{true}" />
<f:argument name="horizontal" type="boolean" optional="{true}" default="{false}" />
<f:argument name="size" type="string" optional="{true}" default="md" />

<f:variable name="classes">menu<f:if condition="{horizontal}"> menu-horizontal</f:if><f:if condition="{size} != 'md'"> menu-{size}</f:if></f:variable>

<ul class="{classes}">
    <f:if condition="{items}">
        <f:then>
            <f:for each="{items}" as="item">
                <li><a href="{item.href}"<f:if condition="{item.active}"> class="menu-active"</f:if>>{item.label}</a></li>
            </f:for>
        </f:then>
        <f:else>
            <f:slot />
        </f:else>
    </f:if>
</ul>
