<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:my="http://typo3.org/ns/Michaelstaatz/ThemeDaisy/Components"
      data-namespace-typo3-fluid="true">

<f:if condition="{record.header}">
    <h3 class="font-semibold mb-2">{record.header}</h3>
</f:if>
<div class="space-y-2">
    <f:for each="{record.tx_themedaisy_accordion_items}" as="item" iteration="it">
        <my:dataDisplay.accordion groupName="ce{record.uid}" title="{item.question}" checked="{it.isFirst}">
            <f:format.nl2br>{item.answer}</f:format.nl2br>
        </my:dataDisplay.accordion>
    </f:for>
</div>

</html>
