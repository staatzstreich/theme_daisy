<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:my="http://typo3.org/ns/Michaelstaatz/ThemeDaisy/Components"
      data-namespace-typo3-fluid="true">

<f:if condition="{record.header}">
    <h3 class="font-semibold mb-2">{record.header}</h3>
</f:if>
<my:feedback.alert variant="{record.tx_themedaisy_variant}" soft="{record.tx_themedaisy_soft}">
    <f:format.nl2br>{record.bodytext}</f:format.nl2br>
</my:feedback.alert>

</html>
