<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:my="http://typo3.org/ns/Michaelstaatz/ThemeDaisy/Components"
      data-namespace-typo3-fluid="true">

<f:if condition="{record.header}">
    <h3 class="font-semibold mb-2">{record.header}</h3>
</f:if>
<div class="space-y-1">
    <f:for each="{record.tx_themedaisy_chat_items}" as="item">
        <my:dataDisplay.chatBubble
            side="{f:if(condition: item.side, then: item.side, else: 'start')}"
            author="{item.author}"
            time="{item.time}"
            variant="{f:if(condition: '{item.side} == \'end\'', then: 'primary', else: 'secondary')}"
        >
            {item.message}
        </my:dataDisplay.chatBubble>
    </f:for>
</div>

</html>
