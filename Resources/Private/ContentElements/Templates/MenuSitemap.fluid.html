<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:layout name="Default" />
<f:section name="Main">

    <ul class="menu bg-base-100 rounded-box w-full">
        <f:render section="Menu" arguments="{menu: menu}" />
    </ul>

</f:section>
<f:section name="Menu">

    <f:if condition="{menu}">
        <f:for each="{menu}" as="page">
            <li>
                <a href="{page.link}"{f:if(condition: page.target, then: ' target="{page.target}"')}{f:if(condition: page.current, then: ' class="menu-active"')} title="{page.title}">
                    <span>{page.title}</span>
                </a>
                <f:if condition="{page.children}">
                    <ul>
                        <f:render section="Menu" arguments="{menu: page.children}" />
                    </ul>
                </f:if>
            </li>
        </f:for>
    </f:if>

</f:section>
</html>
