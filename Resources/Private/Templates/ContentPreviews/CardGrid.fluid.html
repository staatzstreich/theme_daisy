<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true"
>

<f:asset.css identifier="theme_daisy_backend_previews" href="EXT:theme_daisy/Resources/Public/Css/previews.css"/>

<f:if condition="{record.header}"><div class="dsvg-preview__title">{record.header}</div></f:if>
<div class="dsvg-preview-cardgrid">
    <f:for each="{record.tx_themedaisy_card_items}" as="item">
        <div class="dsvg-preview-cardgrid__card">
            <f:if condition="{item.icon}"><span class="dsvg-preview-cardgrid__icon">{item.icon}</span></f:if>
            <div class="dsvg-preview__title">{item.title}</div>
            <div class="dsvg-preview__text">{item.description}</div>
            <f:if condition="{item.link_label}"><span class="dsvg-preview__link">{item.link_label}</span></f:if>
        </div>
    </f:for>
</div>

</html>
